name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # El sitio es 100% estático: "próximo Space", cuenta regresiva y el .ics se
  # calculan en build time. Sin un rebuild periódico, se congelarían en la
  # última vez que se publicó código. Este cron rebuildea aunque no haya
  # cambios, para que la fecha calculada siga siendo la correcta.
  schedule:
    - cron: "0 6 * * *" # todos los días a las 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_FORMSPREE_ID: ${{ vars.PUBLIC_FORMSPREE_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
